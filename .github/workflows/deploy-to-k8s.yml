name: Deploy to Kubernetes

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p $HOME/.kube
          echo "$KUBE_CONFIG_DATA" | base64 --decode > $HOME/.kube/config

      - name: Set image and deploy
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/dietassist-backend:${{ github.sha }}
        run: |
          kubectl set image deployment/dietassist-backend backend=$IMAGE --namespace=default || kubectl apply -f k8s/backend-deployment.yaml

      - name: Set Sentry release (if available)
        env:
          SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then
            echo "Sentry release: $SENTRY_RELEASE"
            # Optionally create a Sentry release via CLI if installed
          fi
