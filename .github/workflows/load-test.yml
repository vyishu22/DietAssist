name: Load Test (manual)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Base URL to run locust against (e.g., https://staging.example.com)'
        required: true

jobs:
  load-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run locust (headless)
        run: |
          cd backend
          locust -f tests/locustfile.py --headless -u 50 -r 5 -t 1m --host ${{ github.event.inputs.target_url }}
