apiVersion: batch/v1
kind: CronJob
metadata:
  name: dietassist-mongo-backup
spec:
  schedule: "0 2 * * *" # daily at 02:00 UTC
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: backup
              # Replace `your-org` with your GitHub org or registry owner. The CI will build/push this image to GHCR.
              image: ghcr.io/your-org/dietassist-backup-tools:latest
              imagePullPolicy: IfNotPresent
              env:
                - name: MONGO_URI
                  valueFrom:
                    secretKeyRef:
                      name: dietassist-secrets
                      key: MONGO_URI
                - name: AWS_S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: dietassist-secrets
                      key: AWS_S3_BUCKET
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: dietassist-secrets
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: dietassist-secrets
                      key: AWS_SECRET_ACCESS_KEY
                - name: AWS_REGION
                  valueFrom:
                    secretKeyRef:
                      name: dietassist-secrets
                      key: AWS_REGION
              # The image bundles a `mongo_backup.sh` entrypoint that runs mongodump and uploads to S3
              command:
                - /usr/local/bin/mongo_backup.sh
              args: []
          restartPolicy: OnFailure
