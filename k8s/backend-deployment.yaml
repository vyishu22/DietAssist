apiVersion: apps/v1
kind: Deployment
metadata:
  name: dietassist-backend
  labels:
    app: dietassist-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dietassist-backend
  template:
    metadata:
      labels:
        app: dietassist-backend
    spec:
      containers:
        - name: backend
          image: dietassist-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: MONGO_URI
              valueFrom:
                configMapKeyRef:
                  name: dietassist-config
                  key: MONGO_URI
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: dietassist-secrets
                  key: SECRET_KEY
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dietassist-secrets
                  key: GEMINI_API_KEY
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: dietassist-secrets
                  key: SENTRY_DSN
            - name: PORT
              value: "5000"
          readinessProbe:
            httpGet:
              path: /api/patient/profile
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: dietassist-backend
spec:
  selector:
    app: dietassist-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
  type: ClusterIP
